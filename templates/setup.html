<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Setup - InterviewAce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="/dashboard"><i class="bi bi-cpu-fill me-2"></i>InterviewAce</a>
            <a href="/dashboard" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                    <h3 class="fw-bold text-center mb-1">Setup AI Interview</h3>
                    <p class="text-muted text-center mb-4">Select your parameters to let Gemini AI tailor the questions for you.</p>

                    <form action="/start-interview" method="POST">
                        
                        <!-- 1. Select Job Role -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">1. Select Job Role</label>
                            <select class="form-select form-select-lg" name="job_role_select" id="jobRoleSelect" onchange="toggleCustomRole()">
                                <option value="Python Developer">Python Developer</option>
                                <option value="Software Developer">Software Developer</option>
                                <option value="Data Analyst">Data Analyst</option>
                                <option value="Web Developer">Web Developer</option>
                                <option value="AI/ML Engineer">AI/ML Engineer</option>
                                <option value="Java Developer">Java Developer</option>
                                <option value="HR Specialist">HR Specialist</option>
                                <option value="Custom">Custom Role (Type Below)</option>
                            </select>
                            
                            <!-- Hidden Custom Input Field -->
                            <div class="mt-2 d-none" id="customRoleDiv">
                                <input type="text" class="form-control" name="custom_job_role" id="customJobRole" placeholder="Type your custom job role (e.g. DevOps Engineer)">
                            </div>
                        </div>

                        <!-- 2. Difficulty Level -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">2. Difficulty Level</label>
                            <div class="row g-2">
                                <div class="col-4">
                                    <input type="radio" class="btn-check" name="difficulty" id="diff1" value="Beginner" checked>
                                    <label class="btn btn-outline-primary w-100 py-2" for="diff1">Beginner</label>
                                </div>
                                <div class="col-4">
                                    <input type="radio" class="btn-check" name="difficulty" id="diff2" value="Intermediate">
                                    <label class="btn btn-outline-primary w-100 py-2" for="diff2">Intermediate</label>
                                </div>
                                <div class="col-4">
                                    <input type="radio" class="btn-check" name="difficulty" id="diff3" value="Advanced">
                                    <label class="btn btn-outline-primary w-100 py-2" for="diff3">Advanced</label>
                                </div>
                            </div>
                        </div>

                        <!-- 3. Interview Type -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">3. Interview Type</label>
                            <select class="form-select" name="interview_type">
                                <option value="Technical">Technical Round</option>
                                <option value="Behavioral">Behavioral Round</option>
                                <option value="System Design">System Design</option>
                                <option value="HR / General">HR / General</option>
                            </select>
                        </div>

                        <!-- 4. Total Questions -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">4. Number of Questions</label>
                            <select class="form-select" name="total_questions">
                                <option value="3">3 Questions (Quick Practice)</option>
                                <option value="5" selected>5 Questions (Standard)</option>
                                <option value="10">10 Questions (Full Mock)</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary-custom w-100 py-3 fs-5 fw-bold mt-3">
                            <i class="bi bi-play-circle-fill me-2"></i>Start AI Interview
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleCustomRole() {
            var select = document.getElementById("jobRoleSelect");
            var customDiv = document.getElementById("customRoleDiv");
            if (select.value === "Custom") {
                customDiv.classList.remove("d-none");
            } else {
                customDiv.classList.add("d-none");
            }
        }
    </script>
</body>
</html>
