<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InterviewAce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="card border-0 shadow-lg p-4 p-md-5 rounded-4" style="max-width: 450px; width: 100%;">
            <div class="text-center mb-4">
                <a href="/" class="navbar-brand justify-content-center fs-3 mb-2">
                    <i class="bi bi-cpu-fill"></i> InterviewAce
                </a>
                <h4 class="fw-bold">Welcome Back</h4>
                <p class="text-muted small">Sign in to continue your interview practice</p>
            </div>

            <form action="/login" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Sign In</button>
            </form>

            <div class="text-center">
                <p class="small text-muted mb-0">Don't have an account? <a href="/register" class="text-decoration-none fw-semibold" style="color: var(--primary-color);">Create Account</a></p>
            </div>
        </div>
    </div>

</body>
</html>
